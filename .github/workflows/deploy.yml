# file path: .github/workflows/deploy.yml
name: Deploy Alpha Beta Tracker

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ==========================================
      # THIS IS THE MISSING STEP:
      # ==========================================
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.2' 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build and Deploy SAM Application
        working-directory: ./backend
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name alpha-beta-stack \
            --resolve-s3 \
            --region us-east-2 \
            --capabilities CAPABILITY_IAM

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Install dependencies and Build React App
        working-directory: ./frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: "https://1idd4spcc5.execute-api.us-east-2.amazonaws.com/Prod"

      - name: Sync built files to S3 bucket
        working-directory: ./frontend
        run: aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} --paths "/*"