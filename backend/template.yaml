# file path: backend/template.yaml
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AlphaBetaTracker SAM Template

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"
  Function:
    Timeout: 60
    MemorySize: 3008

Resources:
  # Python Backend
  AlphaBetaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref AlphaBetaTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AlphaBetaTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /metrics
            Method: get

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: chat.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      Environment:
        Variables:
          GEMINI_API_KEY: "" # Set this in AWS Console secrets later
          DYNAMODB_TABLE: !Ref AlphaBetaTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AlphaBetaTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /chat
            Method: post

  AlphaBetaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ==========================================
  # GO INFRASTRUCTURE
  # ==========================================
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: alphabeta-processing-queue
      VisibilityTimeout: 900

  GoProducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProcessingQueue.QueueName
      Events:
        DailyTrigger:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(15 21 ? * MON-FRI *)"
    Metadata:
      BuildMethod: makefile

  GoWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      Timeout: 900
      ReservedConcurrentExecutions: 1 # <--- ADD THIS LINE to prevent rate limit slaughter
      Environment:
        Variables:
          DB_HOST: "alphabeta-db.c9o4cmack332.us-east-2.rds.amazonaws.com"
          DB_USER: "postgres"
          DB_PASS: "{{resolve:ssm:/alphabeta/db-password}}"
          DB_NAME: "alphabeta"
          TWELVE_DATA_API_KEY: "{{resolve:ssm:/alphabeta/twelve-data-api-key}}"
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt ProcessingQueue.QueueName
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessingQueue.Arn
            BatchSize: 1
    Metadata:
      BuildMethod: makefile

  GoApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: . 
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      Environment:
        Variables:
          DB_HOST: "alphabeta-db.c9o4cmack332.us-east-2.rds.amazonaws.com"
          DB_USER: "postgres"
          DB_PASS: "{{resolve:ssm:/alphabeta/db-password}}"
          DB_NAME: "alphabeta"
          SQS_QUEUE_URL: !Ref ProcessingQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProcessingQueue.QueueName
      Events:
        RankingsApi:
          Type: Api
          Properties:
            Path: /rankings
            Method: get
    Metadata:
      BuildMethod: makefile 

Outputs:
  RankingsApiUrl:
    Description: "API Gateway endpoint URL for Rankings (Go)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/rankings/"